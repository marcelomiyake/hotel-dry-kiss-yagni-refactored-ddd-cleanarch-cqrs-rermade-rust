  namespace: hotel-reservation
spec:
  type: NodePort
  selector:
    app: hotel-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-web
  namespace: hotel-reservation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-web
  template:
    metadata:
      labels:
        app: hotel-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hotel-web
          image: hotel-system/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
