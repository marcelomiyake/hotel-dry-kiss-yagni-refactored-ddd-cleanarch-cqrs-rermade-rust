apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
  namespace: hotel-reservation
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel
  SPRING_DATASOURCE_USERNAME: hotel_app
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend
  namespace: hotel-reservation
spec:
  selector:
    app: hotel-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
  namespace: hotel-reservation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-backend
  template:
    metadata:
      labels:
        app: hotel-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hotel-backend
          image: hotel-system/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hotel-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secrets
                  key: postgres-password
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hotel-secrets
                  key: admin-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 384Mi
              ephemeral-storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-web
  namespace: hotel-reservation
spec:
  type: NodePort
  selector:
    app: hotel-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-web
  namespace: hotel-reservation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-web
  template:
    metadata:
      labels:
        app: hotel-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hotel-web
          image: hotel-system/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
