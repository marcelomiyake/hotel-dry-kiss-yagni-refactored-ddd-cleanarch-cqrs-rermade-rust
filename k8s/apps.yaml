apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
  namespace: hotel-reservation
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel
  SPRING_DATASOURCE_USERNAME: hotel_app
  CATALOG_SERVICE_URL: http://hotel-service:8080
  RATE_SERVICE_URL: http://rate-service:8080
  PAYMENT_SERVICE_URL: http://payment-service:8080
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  namespace: hotel-reservation
spec:
  selector:
    app: hotel-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: hotel-reservation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hotel-service
          image: hotel-system/hotel-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hotel-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secrets
                  key: postgres-password
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hotel-secrets
                  key: admin-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
---
