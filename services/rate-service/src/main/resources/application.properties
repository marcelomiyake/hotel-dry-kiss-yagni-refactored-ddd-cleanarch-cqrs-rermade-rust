server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotel_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hotel_local}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
app.admin.api-key=${ADMIN_API_KEY:}
